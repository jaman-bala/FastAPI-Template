# Локальная инфраструктура для разработки.
# Ключи в docker/seaweedfs/s3.json — только для dev, в PROD заменить.
services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    container_name: seaweedfs_fastapi
    # master + volume + filer + S3-шлюз в одном процессе;
    # -s3.iam=false — встроенный IAM/STS API не используется (ключи в s3.json)
    command: >
      server
      -dir=/data
      -ip=seaweedfs
      -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024
      -volume.max=0
      -filer
      -s3
      -s3.port=8333
      -s3.iam=false
      -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333" # S3 API (SEAWEEDFS_S3_ENDPOINT)
      - "9333:9333" # master UI
      - "8888:8888" # filer UI
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Одноразово создаёт бакет SEAWEEDFS_BUCKET_NAME (по умолчанию avatars)
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.52
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until echo "fs.ls /" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 >/dev/null 2>&1; do sleep 1; done
        echo "s3.bucket.create -name $${SEAWEEDFS_BUCKET_NAME:-avatars}" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888
        echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888
    environment:
      SEAWEEDFS_BUCKET_NAME: ${SEAWEEDFS_BUCKET_NAME:-avatars}
    restart: "no"

volumes:
  seaweedfs_data:
